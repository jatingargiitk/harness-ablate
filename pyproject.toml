[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-ablate"
version = "0.1.0"
description = "Find out which parts of your CLAUDE.md, skills and hooks still help on today's model. Some of them make it worse."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jatin Garg" }]
keywords = ["claude-code", "claude-md", "agents-md", "ablation", "llm", "evals", "coding-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["typer>=0.12", "pyyaml>=6", "rich>=13"]

[project.urls]
Homepage = "https://github.com/jatingargiitk/harness-ablate"
Repository = "https://github.com/jatingargiitk/harness-ablate"
Issues = "https://github.com/jatingargiitk/harness-ablate/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness-ablate = "harness_ablate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["harness_ablate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
